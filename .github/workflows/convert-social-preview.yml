name: Build social sharing preview
on:
  push:
    branches: [feature/family-hub-modern-accessible-20261029]
    paths: [social-preview.svg, .github/workflows/convert-social-preview.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render PNG
        run: |
          python -m pip install cairosvg==2.8.2
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='social-preview.svg',write_to='social-preview.png',output_width=1200,output_height=630)
          from pathlib import Path
          p=Path('social-preview.png')
          assert p.stat().st_size>10000
          print(p.stat().st_size)
          PY
      - name: Commit PNG to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add social-preview.png
          if ! git diff --cached --quiet; then
            git commit -m 'Add social-sharing PNG'
            git push origin HEAD:feature/family-hub-modern-accessible-20261029
          fi
