name: Family Hub responsive QA
on:
  pull_request:
  push:
    branches: [main, feature/family-hub-modern-accessible-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright==1.57.0'
      - run: python -m playwright install --with-deps chromium
      - name: Verify responsive app
        run: |
          python -m http.server 8000 > /tmp/family-hub-server.log 2>&1 &
          python scripts/qa_responsive.py
      - name: Attach screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-hub-browser-qa
          path: qa-output/
          retention-days: 14
          if-no-files-found: ignore
